    <text x="96px" y="70px" style="font-size:8px;fill:#000000;font-family:Arial;text-anchor:end;writing-mode:lr">UDINT</text>
    <text x="132px" y="70px" style="font-size:8px;fill:#000000;font-family:Arial;text-anchor:start;writing-mode:lr">data_len</text>
