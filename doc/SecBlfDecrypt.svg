    <text x="96px" y="38px" style="font-size:8px;fill:#000000;font-family:Arial;text-anchor:end;writing-mode:lr">UDINT</text>
    <text x="132px" y="38px" style="font-size:8px;fill:#000000;font-family:Arial;text-anchor:start;writing-mode:lr">ctx</text>
    <path d="M 105,51,123,51" stroke="black"/>
